<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset</title>
  </head>
  <body>
    <main>
      <h1>Reset password</h1>
      <section id="request-form">
        <label for="identifier">Email address or phone number</label>
        <input id="identifier" name="identifier" autocomplete="username">
        <button id="request-reset" type="button">Send reset instructions</button>
      </section>
      <section id="verify-link" hidden>
        <p>Verifying the email reset link...</p>
      </section>
      <section id="verify-code" hidden>
        <label for="sms-code">SMS verification code</label>
        <input id="sms-code" name="smsCode" inputmode="numeric" autocomplete="one-time-code">
        <button id="verify-code-button" type="button">Verify code</button>
      </section>
      <section id="new-password" hidden>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password">
        <label for="confirmation">Confirm password</label>
        <input id="confirmation" name="confirmation" type="password" autocomplete="new-password">
        <button id="complete-reset" type="button">Change password</button>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script>
      let resetRequestId = null;
      const message = document.querySelector("#message");

      async function verifyEmailLink(linkSecret) {
        const result = await post("/api/password-reset/links/verify", { linkSecret });
        if (result.response.ok) {
          resetRequestId = result.body.resetRequestId;
          document.querySelector("#verify-code").hidden = false;
          document.querySelector("#verify-link").hidden = true;
          message.textContent = "Email link verified.";
        } else {
          message.textContent = result.body.message;
        }
      }

      async function post(url, body) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body),
        });
        return { response, body: await response.json() };
      }

      document.querySelector("#request-reset").addEventListener("click", async () => {
        const result = await post("/api/password-reset/requests", {
          identifier: document.querySelector("#identifier").value,
        });
        message.textContent = result.body.message;
      });

      document.querySelector("#verify-code-button").addEventListener("click", async () => {
        const result = await post("/api/password-reset/verify-code", {
          resetRequestId,
          smsCode: document.querySelector("#sms-code").value,
        });
        if (result.response.ok) {
          document.querySelector("#new-password").hidden = false;
          message.textContent = "SMS code verified.";
        } else {
          message.textContent = result.body.message;
        }
      });

      document.querySelector("#complete-reset").addEventListener("click", async () => {
        const result = await post("/api/password-reset/password", {
          resetRequestId,
          newPassword: document.querySelector("#password").value,
          confirmationPassword: document.querySelector("#confirmation").value,
        });
        message.textContent = result.body.message;
      });

      const linkSecret = new URLSearchParams(window.location.hash.slice(1)).get("linkSecret");
      if (linkSecret) {
        document.querySelector("#verify-link").hidden = false;
        verifyEmailLink(linkSecret);
      }
    </script>
  </body>
</html>
