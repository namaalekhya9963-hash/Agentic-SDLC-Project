name: CI

on:
  push:
    branches:
      - main
      - feat/automated-doc-sync
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Node test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: npm test
